[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-capsolver"
version = "0.1.0"
description = "Native CapSolver tools for CrewAI crews and flows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "capsolver-ai", email = "dev@capsolver.ai" }]
keywords = ["capsolver", "captcha", "ai-agents", "crewai"]
dependencies = ["capsolver-agent>=0.1.0", "crewai>=0.100"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Documentation = "https://docs.capsolver.com/en/guide/ai/capsolver-for-ai-agents/"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_capsolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
